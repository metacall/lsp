name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lsp
          key: verify

      - name: Check tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Preview release notes
        if: github.event_name == 'workflow_dispatch'
        uses: orhun/git-cliff-action@v4
        with:
          version: "2.14.1"
          config: cliff.toml
          args: --strip header --offline
        env:
          OUTPUT: release-notes-preview.md

      - name: Print release notes preview
        if: github.event_name == 'workflow_dispatch'
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lsp
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --all-features --release --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/meta-call-lsp${{ matrix.ext }} --version

      - name: Stage
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          stage="meta-call-lsp-v${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/meta-call-lsp${{ matrix.ext }}" "$stage/"
          cp LICENSE README.md "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "${STAGE}.tar.gz" "${STAGE}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($env:STAGE, "$env:STAGE.zip", [System.IO.Compression.CompressionLevel]::Optimal, $true)

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: meta-call-lsp-${{ matrix.target }}
          path: meta-call-lsp-v*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Manifest
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          targets = [
              "x86_64-unknown-linux-gnu",
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "aarch64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "aarch64-pc-windows-msvc",
          ]
          assets = {}
          for target in targets:
              matches = [
                  path
                  for path in glob.glob(f"dist/meta-call-lsp-{tag}-{target}.*")
                  if path.endswith((".tar.gz", ".zip"))
              ]
              if len(matches) != 1:
                  raise SystemExit(f"expected one archive for {target}, found {matches}")
              path = matches[0]
              with open(path, "rb") as handle:
                  digest = hashlib.sha256(handle.read()).hexdigest()
              name = os.path.basename(path)
              assets[target] = {
                  "file": name,
                  "sha256": digest,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          manifest = {
              "name": "meta-call-lsp",
              "tag": tag,
              "version": tag.removeprefix("v"),
              "repository": repo,
              "assets": assets,
          }
          with open(f"dist/meta-call-lsp-{tag}.json", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.json > SHA256SUMS
          for file in *.tar.gz *.zip; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          version: "2.14.1"
          config: cliff.toml
          args: --current --strip header --offline
        env:
          OUTPUT: dist/RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "meta-call-lsp $GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.changelog }}" \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.json dist/SHA256SUMS
