# Clippy configuration. Clippy reads the MSRV from Cargo.toml, and settings for
# lints that are not enabled only add noise, so this file holds the two knobs
# that change behaviour for the enabled lint set.

# One above the default, for the dispatch-style signatures.
too-many-arguments-threshold = 8

# `unwrap_used` is denied in Cargo.toml; tests may still abort on setup failure.
allow-unwrap-in-tests = true
