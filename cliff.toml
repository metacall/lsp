# git-cliff configuration. See https://git-cliff.org/docs/configuration
#
# Release notes group Conventional Commits by type. Merge commits and version
# bump chores stay out. Unconventional subjects land under Other Changes.
# Run offline so notes never depend on the GitHub API:
#
#   git cliff --config cliff.toml --current --strip header --offline

[changelog]
body = """
{% if version %}## meta-call-lsp {{ version }}{% else %}## Unreleased{% endif %}

Polyglot language server over the meta-ast index. See the
[README](https://github.com/metacall/lsp#readme) for usage.

{% for entry in commits | commit_groups(groups=commit_parsers_groups) -%}
### {{ entry.group | striptags | trim }}

{% for commit in entry.commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/metacall/lsp/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{% if version %}
### Install

Download the archive for your platform, verify it against `SHA256SUMS`, and point your client at the extracted binary over stdio.

- Linux x86_64: `meta-call-lsp-{{ version }}-x86_64-unknown-linux-gnu.tar.gz` (glibc) or `meta-call-lsp-{{ version }}-x86_64-unknown-linux-musl.tar.gz` (static)
- Linux aarch64: `meta-call-lsp-{{ version }}-aarch64-unknown-linux-gnu.tar.gz`
- macOS x86_64: `meta-call-lsp-{{ version }}-x86_64-apple-darwin.tar.gz`
- macOS aarch64: `meta-call-lsp-{{ version }}-aarch64-apple-darwin.tar.gz`
- Windows x86_64: `meta-call-lsp-{{ version }}-x86_64-pc-windows-msvc.zip`
- Windows aarch64: `meta-call-lsp-{{ version }}-aarch64-pc-windows-msvc.zip`

Run `meta-call-lsp --version` after extraction.
{% endif %}
{% if previous.version %}
**Full Changelog**: https://github.com/metacall/lsp/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^ci", group = "<!-- 7 -->CI" },
    { message = "^style", group = "<!-- 8 -->Style" },
    { message = "^revert", group = "<!-- 9 -->Reverts" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore.*version", skip = true },
    { message = "^chore", group = "<!-- 10 -->Maintenance" },
    { message = "^Merge", skip = true },
    { message = ".*", group = "<!-- 11 -->Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/metacall/lsp/pull/${1}))" },
]
